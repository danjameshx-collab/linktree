<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan James :: Links</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #030806;
            background-image:
                radial-gradient(ellipse 80% 45% at 50% -5%, rgba(18, 60, 32, 0.55) 0%, transparent 55%),
                radial-gradient(ellipse 50% 30% at 50% 105%, rgba(12, 45, 22, 0.3) 0%, transparent 55%);
            color: #e8f0ea;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .header img {
            height: 40px;
            width: auto;
            display: block;
        }

        /* ── Main Container ── */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 60px 24px 88px;
        }

        /* ── Profile ── */
        .profile {
            text-align: center;
            margin-bottom: 52px;
        }

        .avatar-wrap {
            margin: 0 auto 22px;
            width: 200px;
            height: 200px;
            position: relative;
        }

        .avatar-img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(93, 217, 138, 0.35);
            box-shadow:
                0 0 0 6px rgba(93, 217, 138, 0.07),
                0 12px 48px rgba(0, 0, 0, 0.6);
            display: block;
        }

        .avatar-fallback {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(42, 120, 70, 0.6), rgba(18, 60, 32, 0.8));
            border: 2px solid rgba(93, 217, 138, 0.35);
            box-shadow: 0 0 0 6px rgba(93, 217, 138, 0.07), 0 12px 48px rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 800;
            color: #5dd98a;
            letter-spacing: -0.02em;
        }

        .name {
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.025em;
            margin-bottom: 10px;
        }

        .bio {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(42, 120, 70, 0.18);
            border: 1px solid rgba(60, 160, 90, 0.3);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #5dd98a;
            margin-bottom: 28px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #5dd98a;
            border-radius: 50%;
            box-shadow: 0 0 6px #5dd98a;
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* ── Social Icons ── */
        .socials {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(220, 240, 228, 0.5);
            text-decoration: none;
            transition: background 0.22s, border-color 0.22s, color 0.22s, transform 0.22s, box-shadow 0.22s;
        }

        .social-icon:hover {
            background: rgba(42, 120, 70, 0.18);
            border-color: rgba(60, 160, 90, 0.35);
            color: #5dd98a;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(93, 217, 138, 0.1);
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
        }

        /* ── Section Divider ── */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
        }

        .section-divider span {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }

        /* ── Link Cards ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            text-decoration: none;
            color: #e8f0ea;
            transition: background 0.22s, border-color 0.22s, transform 0.22s, box-shadow 0.22s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .link-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(93, 217, 138, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.22s;
            pointer-events: none;
        }

        .link-card:hover {
            background: rgba(42, 120, 70, 0.1);
            border-color: rgba(60, 160, 90, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 24px rgba(93, 217, 138, 0.07);
        }

        .link-card:hover::after {
            opacity: 1;
        }

        .link-card.featured {
            background: rgba(42, 120, 70, 0.14);
            border-color: rgba(60, 160, 90, 0.28);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 20px rgba(93, 217, 138, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .link-card.featured:hover {
            background: rgba(42, 120, 70, 0.2);
            border-color: rgba(93, 217, 138, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 32px rgba(93, 217, 138, 0.12);
        }

        .link-card-text {
            flex: 1;
            min-width: 0;
        }

        .link-card-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(93, 217, 138, 0.55);
            margin-bottom: 3px;
        }

        .link-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .link-card-arrow {
            color: rgba(93, 217, 138, 0.45);
            transition: color 0.22s, transform 0.22s;
            flex-shrink: 0;
        }

        .link-card:hover .link-card-arrow {
            color: #5dd98a;
            transform: translateX(4px);
        }

        /* ── Footer ── */
        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding: 28px 24px;
            text-align: center;
        }

        .footer img {
            height: 26px;
            width: auto;
            opacity: 0.35;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .container {
                padding: 44px 20px 64px;
            }

            .link-card {
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>

    </main>

    <!-- ── Footer ── -->
    <footer class="footer">
        <img src="Lincko-logo.png" alt="Lincko" onerror="this.style.display='none'">

</body>
</html>
